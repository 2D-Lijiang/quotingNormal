<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>纸箱报价系统</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app">
        <!-- 顶部导航 -->
        <header class="header">
            <h1>纸箱报价系统</h1>
            <div class="nav-tabs">
                <button class="tab-btn active" data-tab="quotation">报价计算</button>
                <button class="tab-btn" data-tab="templates">箱子模板</button>
                <button class="tab-btn" data-tab="history">历史记录</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main-content">
            <!-- 报价计算模块 -->
            <section id="quotation" class="tab-content active">
                <div class="card">
                    <h2>新建报价</h2>
                    
                    <!-- 模板选择 -->
                    <div class="form-group">
                        <label>选择模板</label>
                        <select id="templateSelect" class="form-control">
                            <option value="">-- 请选择模板 --</option>
                        </select>
                    </div>

                    <!-- 客户信息 -->
                    <div class="form-group">
                        <label>客户名称</label>
                        <input type="text" id="customerName" class="form-control" placeholder="请输入客户名称">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>客户等级</label>
                            <select id="customerLevel" class="form-control">
                                <option value="normal">普通客户 (15%)</option>
                                <option value="long-term">长期客户 (10%)</option>
                                <option value="vip">大客户 (8%)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>订单数量</label>
                            <input type="number" id="orderQuantity" class="form-control" value="1000" min="1">
                        </div>
                    </div>

                    <!-- 纸箱尺寸 -->
                    <div class="section-title">纸箱尺寸</div>
                    <div class="form-group">
                        <label class="radio-group">
                            <input type="radio" name="sizeType" value="outer" checked> 外径
                            <input type="radio" name="sizeType" value="inner"> 内径
                        </label>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>长 (cm)</label>
                            <input type="number" id="boxLength" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>宽 (cm)</label>
                            <input type="number" id="boxWidth" class="form-control" step="0.1">
                        </div>
                        <div class="form-group">
                            <label>高 (cm)</label>
                            <input type="number" id="boxHeight" class="form-control" step="0.1">
                        </div>
                    </div>

                    <!-- 材料配置 -->
                    <div class="section-title">材料配置</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>楞型</label>
                            <select id="fluteType" class="form-control">
                                <option value="A">A楞 (1.53)</option>
                                <option value="B">B楞 (1.36)</option>
                                <option value="C">C楞 (1.50)</option>
                                <option value="E">E楞 (1.27)</option>
                                <option value="AB">AB楞 (2.08)</option>
                                <option value="BC">BC楞 (2.04)</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>面纸克重 (g/㎡)</label>
                            <input type="number" id="facePaperWeight" class="form-control" value="250" min="100">
                        </div>
                        <div class="form-group">
                            <label>里纸克重 (g/㎡)</label>
                            <input type="number" id="innerPaperWeight" class="form-control" value="250" min="100">
                        </div>
                        <div class="form-group">
                            <label>芯纸克重 (g/㎡)</label>
                            <input type="number" id="corePaperWeight" class="form-control" value="120" min="80">
                        </div>
                    </div>

                    <!-- 价格参数 -->
                    <div class="section-title">价格参数</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>纸板单价 (元/㎡)</label>
                            <input type="number" id="boardPrice" class="form-control" value="3.5" step="0.01" min="0">
                        </div>
                        <div class="form-group">
                            <label>损耗率 (%)</label>
                            <input type="number" id="wasteRate" class="form-control" value="5" step="0.1" min="0" max="20">
                        </div>
                    </div>

                    <!-- 工艺配置 -->
                    <div class="section-title">工艺配置</div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>印刷色数</label>
                            <select id="printColors" class="form-control">
                                <option value="0">无印刷</option>
                                <option value="1">1色 (+0.10元/㎡)</option>
                                <option value="2">2色 (+0.18元/㎡)</option>
                                <option value="3">3色 (+0.25元/㎡)</option>
                                <option value="4">4色 (+0.32元/㎡)</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>特殊工艺</label>
                            <select id="specialProcess" class="form-control">
                                <option value="0">无</option>
                                <option value="0.15">烫金 (+0.15元/㎡)</option>
                                <option value="0.20">覆膜 (+0.20元/㎡)</option>
                                <option value="0.25">UV (+0.25元/㎡)</option>
                            </select>
                        </div>
                    </div>

                    <div class="action-buttons">
                        <button id="calculateBtn" class="btn btn-primary">计算报价</button>
                        <button id="resetBtn" class="btn btn-secondary">重置</button>
                    </div>
                </div>

                <!-- 报价结果 -->
                <div id="resultCard" class="card" style="display: none;">
                    <h2>报价结果</h2>
                    <div class="result-grid">
                        <div class="result-item">
                            <span class="result-label">用料面积</span>
                            <span class="result-value" id="areaResult">0.00 ㎡</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">纸料成本</span>
                            <span class="result-value" id="materialCost">0.00 元</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">损耗成本</span>
                            <span class="result-value" id="wasteCost">0.00 元</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">工艺成本</span>
                            <span class="result-value" id="processCost">0.00 元</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">利润</span>
                            <span class="result-value" id="profitCost">0.00 元</span>
                        </div>
                        <div class="result-item">
                            <span class="result-label">税费 (13%)</span>
                            <span class="result-value" id="taxCost">0.00 元</span>
                        </div>
                    </div>
                    <div class="final-result">
                        <div class="final-item">
                            <span class="final-label">单个纸箱报价</span>
                            <span class="final-value" id="unitPrice">0.00 元</span>
                        </div>
                        <div class="final-item">
                            <span class="final-label">订单总价</span>
                            <span class="final-value large" id="totalPrice">0.00 元</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button id="saveQuoteBtn" class="btn btn-success">保存报价</button>
                        <button id="exportQuoteBtn" class="btn btn-secondary">导出报价单</button>
                    </div>
                </div>
            </section>

            <!-- 箱子模板模块 -->
            <section id="templates" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2>箱子模板管理</h2>
                        <button id="addTemplateBtn" class="btn btn-primary">新建模板</button>
                    </div>
                    <div id="templateList" class="template-list"></div>
                </div>
            </section>

            <!-- 历史记录模块 -->
            <section id="history" class="tab-content">
                <div class="card">
                    <div class="card-header">
                        <h2>报价历史记录</h2>
                        <div class="filter-group">
                            <input type="text" id="searchHistory" class="form-control" placeholder="搜索客户名称...">
                            <select id="filterLevel" class="form-control">
                                <option value="">全部等级</option>
                                <option value="normal">普通客户</option>
                                <option value="long-term">长期客户</option>
                                <option value="vip">大客户</option>
                            </select>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-value" id="totalQuotes">0</div>
                            <div class="stat-label">总报价次数</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="totalAmount">0.00</div>
                            <div class="stat-label">总金额 (元)</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value" id="avgUnitPrice">0.00</div>
                            <div class="stat-label">平均单价 (元)</div>
                        </div>
                    </div>
                    <div id="historyList" class="history-list"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- 新建/编辑模板弹窗 -->
    <div id="templateModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">新建模板</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>模板名称</label>
                    <input type="text" id="templateName" class="form-control" placeholder="例如: 标准外箱 0201">
                </div>
                <div class="form-group">
                    <label>模板类型</label>
                    <select id="templateType" class="form-control">
                        <option value="standard">标准箱型</option>
                        <option value="semi-custom">半定制</option>
                        <option value="custom">全自定义</option>
                    </select>
                </div>
                <div class="section-title">尺寸公式配置</div>
                <div class="form-row">
                    <div class="form-group">
                        <label>纸长余量 (cm)</label>
                        <input type="number" id="marginLength" class="form-control" value="5" step="0.1">
                    </div>
                    <div class="form-group">
                        <label>纸宽余量 (cm)</label>
                        <input type="number" id="marginWidth" class="form-control" value="3" step="0.1">
                    </div>
                </div>
                <div class="form-group">
                    <label>描述</label>
                    <textarea id="templateDesc" class="form-control" rows="3" placeholder="模板描述..."></textarea>
                </div>
                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="templateActive" checked> 启用模板
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">取消</button>
                <button id="saveTemplateBtn" class="btn btn-primary">保存</button>
            </div>
        </div>
    </div>

    <!-- 报价详情弹窗 -->
    <div id="quoteDetailModal" class="modal">
        <div class="modal-content large">
            <div class="modal-header">
                <h3>报价详情</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="quoteDetailContent"></div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">关闭</button>
                <button id="copyQuoteBtn" class="btn btn-primary">复制为新报价</button>
                <button id="deleteQuoteBtn" class="btn btn-danger">删除记录</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
